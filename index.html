<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./assets/icons/Pokodex_logo.png">
    <title>Pokedex</title>

    <link rel="stylesheet" href="./styles/fonts.css">
    <script src="./scripts/assets.js"></script>
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts/template.js"></script>

</head>

<body onload="init()">

    <header class="flex-between-center">
        <div class="logo-container flex-center">
            <img src="./assets/icons/Pokodex_logo.png" alt="Pokedex Logo" class="logo-icon">
            <h2>Neelima's Pokedex</h2>
        </div>

        <div class="search-container flex-center">
            <input type="text" id="searchInput" data-id="search-input" placeholder="Search min 3 characters...">
            <button id="searchBtn" onclick="searchPokemon()"> Search </button>
        </div>
    </header>

    <main data-id="content" class="main_class">
        <div id="character-container"></div>

        <dialog id="pokemonDialog">
            <div>
                <div class="dialog-header-section">
                    <h2 id="dialogName" style="text-transform: capitalize;"></h2>
                    <button id="closeBtn" onclick="closePokemonDialog()">Close</button>
                </div>

                <h2 id="dialogImageWrapper"></h2>
                <img id="dialogImage" alt="Pokemon Image">

                <!-- 1. Tabs Header Navigation -->
                <div class="tab-buttons">
                    <button id="btn-main" class="tab-btn active"
                        onclick="switchTab('tab-main', 'btn-main')">main</button>
                    <button id="btn-stats" class="tab-btn" onclick="switchTab('tab-stats', 'btn-stats')">stats</button>
                    <button id="btn-evo" class="tab-btn" onclick="switchTab('tab-evoChain', 'btn-evo')">evo
                        chain</button>
                </div>

                <!-- 2. Tabs Content Sections -->
                <div class="tab-content-container">
                    <!-- Main Tab Content -->
                    <div id="tab-main" class="tab-content">
                        <p>Height: <span id="pokeHeight"></span></p>
                        <p>Weight: <span id="pokeWeight"></span></p>
                        <p>Base Experience: <span id="pokeExp"></span></p>
                        <p>Abilities: <span id="pokeAbilities"></span></p>
                    </div>

                    <!-- Stats Tab Content -->
                    <div id="tab-stats" class="tab-content">
                        <div id="statsContainer"></div>
                    </div>

                    <!-- Evolution Chain Tab Content -->
                    <div id="tab-evoChain" class="tab-content">
                        <div id="evoContainer" class="evo-chain-container">
                            Evolution details here...
                        </div>
                    </div>
                </div>

                <div class="dialog-footer-section">
                    <button id="prevBtn" onclick="showPrevPokemon()">Previous</button>
                    <button id="nextBtn" onclick="showNextPokemon()">Next</button>
                </div>
            </div>
        </dialog>
        <div class="load-more-container">
            <div id="loadMsg" class="load-message">
                Enter your wished list to load more
            </div>
            <div class="load-controls">
                <input type="number" id="loadAmountInput" value="0" min="1" max="50">
                <button id="loadMoreBtn" onclick="loadMorePokemon()">Load More</button>
                <button id="homeBtn" onclick="resetHome()" style="display: none;">Home Page</button>
            </div>
        </div>
    </main>

    <footer class="flex-center">
        <div class="footer-content flex-column-center">
            <img src="assets/icons/footer_left.png" alt="Footer logo" class="footer-logo">
            <p>&copy; 2026 Neelima's Pokodex</p>
            <img src="./assets/icons/footer_right.png" alt="Footer logo" class="footer-logo">

        </div>
    </footer>
    <script src="./script.js"></script>
</body>

</html>
